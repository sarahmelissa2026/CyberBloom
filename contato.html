    <link
      href="https://googleapis.com/css2?family=Fredoka:wght@300..700&amp;family=Nunito:ital,wght@0,200..1000;1,200..1000&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://cloudflare.com" rel="stylesheet" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <a aria-label="CyberBloom home" href="index.html">

      </div>
      <button
        aria-controls="navLinks"
        aria-expanded="false"
        aria-label="Open menu"
        class="menu-toggle"
        id="menuToggle"
        type="button"
      >
        ☰
      </button>
      <nav aria-label="Main navigation" class="main-nav">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">HOME</a></li>
          <li><a href="sobre.html">SOBRE</a></li>
          <li class="dropdown">
            <button
              aria-expanded="false"
              aria-haspopup="true"
              class="dropbtn"
              type="button"
            >
              CIBERSEGURANÇA <span aria-hidden="true">▾</span>
            </button>
            <ul class="dropdown-menu">
              <li><a href="malware.html">Malware</a></li>
              <li><a href="engenhariasocial.html">Golpes</a></li>
              <li><a href="ataques.html">Ataques</a></li>
              <li><a href="protecao.html">Segurança</a></li>
            </ul>
          </li>
          <li><a href="bibliografia.html">BIBLIOGRAFIA</a></li>
          <li class="dropdown">
            <button
              aria-expanded="false"
              aria-haspopup="true"
              class="dropbtn"
              type="button"
            >
              CRÉDITOS <span aria-hidden="true">▾</span>
            </button>
            <ul class="dropdown-menu">
              <li><a href="creditos.html">Orientadores</a></li>
              <li><a href="creditos2.html">Desenvolvedores</a></li>
            </ul>
          </li>
          <li><a class="active" href="contato.html">CONTATO</a></li>
        </ul>
      </nav>
      <div class="flags" aria-label="Language selection">
        <a href="contato.html" aria-label="Português">
          <img src="img/brazilian_flag.jpg" class="flag" alt="Português" />
        </a>
        <a href="contato-en.html" aria-label="English">
          <img src="img/united_states_flag.jpg" class="flag" alt="English" />
        </a>
      </div>
    </header>
    <section class="contact-section">
      <h2 class="section-title-line">Fale Conosco</h2>
      <div class="form-container">
        <form>
          <div class="form-group">
            <label for="nome">Nome:</label>
            <input
              id="nome"
              maxlength="50"
              minlength="3"
              name="nome"
              pattern="[A-Z a-z\s]+"
              placeholder="Digite seu Nome"
              required=""
              type="text"
            />
          </div>
          <div class="form-group">
            <label for="fone">Telefone:</label>
            <input
              id="fone"
              name="fone"
              pattern="[0-9]{10,11}"
              placeholder="11999998888"
              required=""
              title="Digite apenas números (DDD + Telefone)."
              type="tel"
            />
          </div>
          <div class="form-group">
            <label for="email">E-mail:</label>
            <input
              id="email"
              name="email"
              placeholder="exemplo@email.com"
              required=""
              type="email"
            />
          </div>
          <div class="form-group">
            <label for="obs">Obs:</label>
            <textarea
              cols="30"
              id="obs"
              placeholder="Sua mensagem aqui..."
              rows="6"
            ></textarea>
          </div>
          <div class="form-buttons">
            <button class="btn-submit" type="submit">Enviar</button>
            <button class="btn-reset" type="reset">Limpar</button>
          </div>
        </form>
      </div>
    </section>
    <footer class="bottom-banner">
      <div class="bottom-mascot">
        <i class="fa-solid fa-cat"></i>
      </div>
      <div class="bottom-quote">
        <a
          href="#top"
          style="position: fixed; bottom: 20px; right: 20px; z-index: 9999"
        >
          <img
            alt="Subir ao topo"
            src="img/up.png"
            style="width: 50px; height: auto"
          />
        </a>
        <p>
          ETEC HUMBERTO FERÚCIO GAZETTA 2026 - &copy;Todos os direitos
          reservados<br />
          Trabalho Acadêmico sem fins lucrativos.
        </p>
        <span>Portas Abertas</span>
      </div>
      <div class="bottom-network">
        <i class="fa-solid fa-hubspot"></i>
      </div>
    </footer>
    <script>
      (() => {
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.getElementById("navLinks");
        const dropdowns = document.querySelectorAll(".navbar .dropdown");

        if (!menuToggle || !navLinks) return;

        menuToggle.addEventListener("click", (event) => {
          event.stopPropagation();
          const open = navLinks.classList.toggle("show");
          menuToggle.setAttribute("aria-expanded", String(open));
        });

        dropdowns.forEach((dropdown) => {
          const button = dropdown.querySelector(".dropbtn");
          const menu = dropdown.querySelector(".dropdown-menu");
          if (!button || !menu) return;

          button.addEventListener("click", (event) => {
            event.stopPropagation();
            const willOpen = !menu.classList.contains("show");
            document
              .querySelectorAll(".navbar .dropdown-menu.show")
              .forEach((other) => {
                other.classList.remove("show");
                const otherButton =
                  other.parentElement.querySelector(".dropbtn");
                if (otherButton)
                  otherButton.setAttribute("aria-expanded", "false");
              });
            menu.classList.toggle("show", willOpen);
            button.setAttribute("aria-expanded", String(willOpen));
          });
        });

        document.addEventListener("click", () => {
          document
            .querySelectorAll(".navbar .dropdown-menu.show")
            .forEach((menu) => menu.classList.remove("show"));
          document
            .querySelectorAll(".navbar .dropbtn")
            .forEach((button) => button.setAttribute("aria-expanded", "false"));
        });

        navLinks.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            navLinks.classList.remove("show");
            menuToggle.setAttribute("aria-expanded", "false");
          });
        });
      })();
    </script>
  </body>
</html>
